<VirtualHost *:80>
    ServerName 192.168.26.23

    # Frontend Vue.js
    DocumentRoot /var/www/html/rrhh/frontend/dist
    <Directory /var/www/html/rrhh/frontend/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    # Backend Laravel API
    ProxyPreserveHost On
    ProxyPass /iclock/ http://127.0.0.1:9000/api/iclock/
    ProxyPassReverse /iclock/ http://127.0.0.1:9000/api/iclock/
    ProxyPass        /api http://127.0.0.1:9000/api
    ProxyPassReverse /api http://127.0.0.1:9000/api

    ErrorLog ${APACHE_LOG_DIR}/rrhh_error.log
    CustomLog ${APACHE_LOG_DIR}/rrhh_access.log combined
</VirtualHost>
