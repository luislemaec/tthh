map $request_uri $rrhh_request_path {
    "~^(?<rrhh_original_path>[^?]*)" $rrhh_original_path;
}

log_format rrhh '$remote_addr $request_method $rrhh_request_path status=$status '
                'total_s=$request_time upstream_s=$upstream_response_time';

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 25m;
    access_log /dev/stdout rrhh;
    error_log /dev/stderr warn;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Reutiliza archivos del host sin depender del symlink creado en Windows.
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass backend:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 70s;
    }

    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}
