name: rrhh-dev

services:
  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    env_file:
      - path: .env.docker
        format: raw
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - backend_cache:/var/www/html/bootstrap/cache
      - backend_framework:/var/www/html/storage/framework
      - backend_logs:/var/www/html/storage/logs
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test: [CMD, php, /usr/local/bin/fpm-health.php]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    restart: unless-stopped

  nginx:
    image: nginx:stable-bookworm@sha256:552e7481ca93ffccd046aa658dbbed22caefbc09c66fa7cd247cbb90b8a5c609
    ports:
      - ${DOCKER_BIND_ADDRESS:-127.0.0.1}:${DOCKER_BACKEND_PORT:-8001}:80
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "curl --fail --silent http://127.0.0.1/up > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    user: node
    environment:
      VITE_API_URL: ${DOCKER_API_URL:-http://127.0.0.1:8001/api}
      VITE_APP_AMBIENTE: ${VITE_APP_AMBIENTE:-pruebas}
      VITE_DOCKER_POLLING: 'true'
      VITE_HMR_CLIENT_PORT: ${DOCKER_FRONTEND_PORT:-5174}
    ports:
      - ${DOCKER_BIND_ADDRESS:-127.0.0.1}:${DOCKER_FRONTEND_PORT:-5174}:5173
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    restart: unless-stopped

volumes:
  backend_vendor:
  backend_cache:
  backend_framework:
  backend_logs:
  frontend_modules:
